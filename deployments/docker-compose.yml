services:
  postgres:
    image: postgres:17
    container_name: clinical-results-postgres
    environment:
      POSTGRES_DB: clinical_results
      POSTGRES_USER: clinical_user
      POSTGRES_PASSWORD: clinical_password
    ports:
      - "5432:5432"
    volumes:
      - clinical_results_postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U clinical_user -d clinical_results
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: clinical-results-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    expose:
      - "4317"
      - "4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: clinical-results-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: clinical-results-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:12.2.0
    container_name: clinical-results-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - clinical_results_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  clinical_results_postgres_data:
  clinical_results_grafana_data: