  <circle cx="52" cy="15" r="7" fill="#FF5C4D"/>
  <path d="M52 11.4v4.9" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="52" cy="18.5" r="1.15" fill="#fff"/>
